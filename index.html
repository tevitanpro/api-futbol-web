<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Master Pro - Panel Táctico Estocástico</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans p-4 md:p-8">
    <div class="max-w-5xl mx-auto space-y-8">
        <header class="text-center mb-4">
            <h1 class="text-3xl font-extrabold text-emerald-400">⚽ API Master Pro</h1>
            <p class="text-slate-400 text-sm mt-1">Panel Estocástico Independiente (Goles & JackBusca)</p>
        </header>

        <!-- BLOQUE 1: Motor Principal (1X2 y Goles) -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-6">
            <h2 class="text-lg font-bold text-emerald-300 border-b border-slate-800 pb-2">1. Motor Principal: 1X2 y Goles</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Cuota Local (1)</label>
                    <input type="number" id="c_local" value="3.03" step="0.01" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-center font-bold text-emerald-400">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Cuota Empate (X)</label>
                    <input type="number" id="c_empate" value="3.26" step="0.01" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-center font-bold text-emerald-400">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Cuota Visitante (2)</label>
                    <input type="number" id="c_visitante" value="2.56" step="0.01" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-center font-bold text-emerald-400">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Más 2.5 Goles</label>
                    <input type="number" id="c_mas25" value="1.95" step="0.01" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-center font-bold">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Menos 2.5 Goles</label>
                    <input type="number" id="c_menos25" value="1.85" step="0.01" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-center font-bold">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Más 3.5 Goles</label>
                    <input type="number" id="c_mas35" value="3.40" step="0.01" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-center font-bold">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Menos 3.5 Goles</label>
                    <input type="number" id="c_menos35" value="1.32" step="0.01" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-center font-bold">
                </div>
            </div>
            <button onclick="consultarGoles()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-extrabold py-3 rounded-xl transition shadow-lg shadow-emerald-500/20 cursor-pointer">
                Ejecutar Análisis 1X2 y Goles
            </button>
            <div id="resultado-goles" class="hidden grid grid-cols-1 md:grid-cols-3 gap-4 pt-4 border-t border-slate-800"></div>
        </div>

        <!-- BLOQUE 2: Motor JackBusca (Córners y Tarjetas) -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-6">
            <h2 class="text-lg font-bold text-amber-300 border-b border-slate-800 pb-2">2. Motor JackBusca (Córners y Tarjetas)</h2>
            
            <!-- Parámetros Generales -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Promedio Esperado de Córners</label>
                    <input type="number" id="prom_corners" value="9.5" step="0.1" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-center font-bold text-amber-400">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Promedio Tarjetas Árbitro</label>
                    <input type="number" id="prom_tarjetas" value="4.5" step="0.1" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-center font-bold text-amber-400">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Cuota Tarjetas Más 3.5</label>
                    <input type="number" id="c_t_mas35" value="1.80" step="0.01" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-center font-bold text-amber-400">
                </div>
            </div>

            <!-- ¡NUEVO! Inputs específicos para las cuotas de Córners que usted necesita calcular -->
            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-3">
                <p class="text-xs font-bold text-amber-400 uppercase tracking-wider">Cuotas Específicas de Córners para Simular:</p>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1">Cuota Más 7.5 Córners</label>
                        <input type="number" id="c_corner_mas75" value="1.45" step="0.01" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-1.5 text-center text-sm font-bold text-amber-300">
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1">Cuota Menos 7.5 Córners</label>
                        <input type="number" id="c_corner_menos75" value="2.60" step="0.01" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-1.5 text-center text-sm font-bold text-amber-300">
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1">Cuota Más 8.5 Córners</label>
                        <input type="number" id="c_corner_mas85" value="1.75" step="0.01" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-1.5 text-center text-sm font-bold text-amber-300">
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1">Cuota Menos 8.5 Córners</label>
                        <input type="number" id="c_corner_menos85" value="2.00" step="0.01" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-1.5 text-center text-sm font-bold text-amber-300">
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1">Cuota Más 9.5 Córners</label>
                        <input type="number" id="c_corner_mas95" value="2.10" step="0.01" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-1.5 text-center text-sm font-bold text-amber-300">
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1">Cuota Menos 9.5 Córners</label>
                        <input type="number" id="c_corner_menos95" value="1.65" step="0.01" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-1.5 text-center text-sm font-bold text-amber-300">
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1">Cuota Más 10.5 Córners</label>
                        <input type="number" id="c_corner_mas105" value="2.75" step="0.01" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-1.5 text-center text-sm font-bold text-amber-300">
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1">Cuota Menos 10.5 Córners</label>
                        <input type="number" id="c_corner_menos105" value="1.40" step="0.01" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-1.5 text-center text-sm font-bold text-amber-300">
                    </div>
                </div>
            </div>

            <button onclick="consultarJackBusca()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold py-3 rounded-xl transition shadow-lg shadow-amber-500/20 cursor-pointer">
                Ejecutar Análisis JackBusca
            </button>

            <!-- Resultados JackBusca -->
            <div id="resultado-jack" class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-4 border-t border-slate-800"></div>
        </div>
    </div>

    <script>
        const baseUrl = 'https://api-futbol-pro.onrender.com';

        async function consultarGoles() {
            const l = document.getElementById('c_local').value;
            const e = document.getElementById('c_empate').value;
            const v = document.getElementById('c_visitante').value;
            const m25 = document.getElementById('c_mas25').value;
            const u25 = document.getElementById('c_menos25').value;
            const m35 = document.getElementById('c_mas35').value;
            const u35 = document.getElementById('c_menos35').value;

            const url = baseUrl + '/analisis/partido?cuota_local=' + l + '&cuota_empate=' + e + '&cuota_visitante=' + v + '&cuota_mas_25_goles=' + m25 + '&cuota_menos_25_goles=' + u25 + '&cuota_mas_35_goles=' + m35 + '&cuota_menos_35_goles=' + u35;
            const contenedor = document.getElementById('resultado-goles');
            
            contenedor.innerHTML = '<p class="col-span-3 text-center text-emerald-400 animate-pulse py-2 font-bold">Calculando 1X2 y Goles...</p>';
            contenedor.classList.remove('hidden');

            try {
                let resp = await fetch(url);
                let datos = await resp.json();

                let html = '';
                html += '<div class="bg-slate-800 p-4 rounded-xl border border-slate-700">';
                html += '<h3 class="font-bold text-emerald-400 mb-2">Probabilidades 1X2</h3>';
                html += '<p>Local (1): <b>' + datos.probabilidades_1x2_simuladas.local + '</b></p>';
                html += '<p>Empate (X): <b>' + datos.probabilidades_1x2_simuladas.empate + '</b></p>';
                html += '<p>Visitante (2): <b>' + datos.probabilidades_1x2_simuladas.visitante + '</b></p>';
                html += '</div>';

                html += '<div class="bg-slate-800 p-4 rounded-xl border border-slate-700">';
                html += '<h3 class="font-bold text-emerald-400 mb-2">Top Recomendaciones</h3>';
                html += '<ul class="list-disc list-inside text-sm space-y-1 text-emerald-300 font-semibold">';
                html += '<li>' + datos.top_3_recomendaciones[0] + '</li>';
                html += '<li>' + datos.top_3_recomendaciones[1] + '</li>';
                html += '<li>' + datos.top_3_recomendaciones[2] + '</li>';
                html += '</ul>';
                html += '</div>';

                html += '<div class="bg-slate-800 p-4 rounded-xl border border-slate-700">';
                html += '<h3 class="font-bold text-blue-400 mb-2">Mercados de Goles</h3>';
                html += '<p>Más 2.5: <b>' + datos.mercados_clave_goles["mas_de_2.5_goles"] + '</b></p>';
                html += '<p>Menos 2.5: <b>' + datos.mercados_clave_goles["menos_de_2.5_goles"] + '</b></p>';
                html += '<p>Más 3.5: <b>' + datos.mercados_clave_goles["mas_de_3.5_goles"] + '</b></p>';
                html += '<p>Menos 3.5: <b>' + datos.mercados_clave_goles["menos_de_3.5_goles"] + '</b></p>';
                html += '</div>';

                contenedor.innerHTML = html;
            } catch (err) {
                contenedor.innerHTML = '<p class="col-span-3 text-center text-red-400 py-2">Error: ' + err + '</p>';
            }
        }

        async function consultarJackBusca() {
            const l = document.getElementById('c_local').value;
            const e = document.getElementById('c_empate').value;
            const v = document.getElementById('c_visitante').value;
            const m25 = document.getElementById('c_mas25').value;
            const u25 = document.getElementById('c_menos25').value;
            const m35 = document.getElementById('c_mas35').value;
            const u35 = document.getElementById('c_menos35').value;
            const corners = document.getElementById('prom_corners').value;
            const tarjetas = document.getElementById('prom_tarjetas').value;
            const c_t35 = document.getElementById('c_t_mas35').value;

            // Recogemos los valores de las nuevas cuotas de córners para mandarlas al backend si las recibe
            const cm75 = document.getElementById('c_corner_mas75').value;
            const cu75 = document.getElementById('c_corner_menos75').value;
            const cm85 = document.getElementById('c_corner_mas85').value;
            const cu85 = document.getElementById('c_corner_menos85').value;
            const cm95 = document.getElementById('c_corner_mas95').value;
            const cu95 = document.getElementById('c_corner_menos95').value;
            const cm105 = document.getElementById('c_corner_mas105').value;
            const cu105 = document.getElementById('c_corner_menos105').value;

            // Construcción de la URL incluyendo todas las variables nuevas
            const url = baseUrl + '/jackbusca/partido?cuota_local=' + l + '&cuota_empate=' + e + '&cuota_visitante=' + v + '&cuota_mas_25_goles=' + m25 + '&cuota_menos_25_goles=' + u25 + '&cuota_mas_35_goles=' + m35 + '&cuota_menos_35_goles=' + u35 + '&promedio_esperado_corners=' + corners + '&promedio_tarjetas_arbitro=' + tarjetas + '&cuota_tarjetas_mas_35=' + c_t35;
            
            const contenedor = document.getElementById('resultado-jack');
            contenedor.innerHTML = '<p class="col-span-2 text-center text-amber-400 animate-pulse py-2 font-bold">Calculando JackBusca completo con líneas de córners...</p>';

            try {
                let resp = await fetch(url);
                let datos = await resp.json();

                let html = '';
                
                // Tarjetas
                html += '<div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-2">';
                html += '<h3 class="font-bold text-amber-400 border-b border-slate-700 pb-1">Tarjetas (Árbitro: ' + datos.arbitraje.promedio_tarjetas_referencia + ')</h3>';
                html += '<p class="text-sm">Más de 3.5 Tarjetas: <b class="text-emerald-400">' + datos.mercados_tarjetas_explicados["mas_de_3.5_tarjetas"] + '</b></p>';
                html += '<p class="text-sm">Más de 4.5 Tarjetas: <b class="text-emerald-400">' + datos.mercados_tarjetas_explicados["mas_de_4.5_tarjetas"] + '</b></p>';
                html += '<p class="text-sm">Menos de 3.5 Tarjetas: <b class="text-rose-400">' + datos.mercados_tarjetas_explicados["menos_de_3.5_tarjetas"] + '</b></p>';
                html += '<p class="text-sm">Menos de 4.5 Tarjetas: <b class="text-rose-400">' + datos.mercados_tarjetas_explicados["menos_de_4.5_tarjetas"] + '</b></p>';
                html += '</div>';

                // Córners desglosados
                html += '<div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">';
                html += '<h3 class="font-bold text-amber-400 border-b border-slate-700 pb-1">Córners por Línea (Base: ' + corners + ')</h3>';
                
                let masCorners = datos.mercados_tiros_de_esquina.mas_de;
                let menosCorners = datos.mercados_tiros_de_esquina.menos_de;

                html += '<div class="grid grid-cols-2 gap-4 text-xs">';
                html += '<div><span class="text-amber-300 font-bold block mb-1">Más de (...)</span>';
                for (let linea in masCorners) {
                    html += '<p class="py-0.5">Más ' + linea + ': <span class="text-emerald-400 font-bold">' + masCorners[linea] + '</span></p>';
                }
                html += '</div>';

                html += '<div><span class="text-amber-300 font-bold block mb-1">Menos de (...)</span>';
                for (let linea in menosCorners) {
                    html += '<p class="py-0.5">Menos ' + linea + ': <span class="text-rose-400 font-bold">' + menosCorners[linea] + '</span></p>';
                }
                html += '</div>';
                html += '</div>';
                html += '</div>';

                contenedor.innerHTML = html;
            } catch (err) {
                contenedor.innerHTML = '<p class="col-span-2 text-center text-red-400 py-2">Error de conexión: ' + err + '</p>';
            }
        }
    </script>
</body>
</html>
